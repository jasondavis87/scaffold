name: Claude Review

# Reviews every PR automatically on open and on each new push.
# This repo is a scaffold template, so review weighs template correctness
# (what generated projects inherit) as heavily as the diff itself.
on:
  pull_request:
    types: [opened, synchronize]

# Only ever review the newest commit on a branch. A superseded review is both
# wrong (it describes code that moved) and expensive, since every run draws on
# the Claude subscription behind CLAUDE_CODE_OAUTH_TOKEN.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This repository is a scaffold: every new project is generated from
            it, so a mistake here is copied into every downstream project.
            Read AGENTS.md before reviewing — it is the source of truth for the
            rules this repo holds itself and its generated projects to.

            Review this pull request for:
            - Bugs and correctness problems in the diff.
            - Violations of the rules in AGENTS.md (package manager, Convex-only
              backend, UniWind vs NativeWind, no direct react-native imports,
              Zustand-only AsyncStorage access, Zod validation, Git/trunk rules).
            - Template correctness: placeholders, scripts, tooling configs, CI
              and docs must be right for a freshly generated project, not just
              for this repo. Flag anything that would break `scripts/setup.sh`,
              leave stale `scaffold` naming in a generated project, or drift
              docs out of sync with the code they describe.

            Be specific and concise. Report what is actually wrong; do not pad
            the review with praise or restate the diff.

            Note: The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
